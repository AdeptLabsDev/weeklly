name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vet · lint · test · vuln · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integridade das dependências
        run: go mod verify

      - name: Ferramentas (versões iguais às do repositório local)
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: go vet
        run: task vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Testes com detector de corrida
        run: task test:race

      - name: Vulnerabilidades conhecidas
        run: task vuln

      - name: Build de produção (Tailwind + binário)
        run: task build

  image:
    name: imagem docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: weeklly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
