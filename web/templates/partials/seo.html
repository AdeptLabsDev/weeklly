{{define "seo"}}
  <meta name="robots" content="{{.SEO.Robots}}">
  {{if .Public}}
  <meta name="description" content="{{.SEO.Description}}">
  {{with .SEO.Canonical}}<link rel="canonical" href="{{.}}">{{end}}
  {{range .SEO.Alternates}}<link rel="alternate" hreflang="{{.Lang}}" href="{{.URL}}">{{end}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{.L.T "app.name"}}">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="{{.SEO.Description}}">
  <meta property="og:locale" content="{{.SEO.Locale}}">
  {{range .SEO.OtherLocales}}<meta property="og:locale:alternate" content="{{.}}">{{end}}
  {{with .SEO.Canonical}}<meta property="og:url" content="{{.}}">{{end}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{.Title}}">
  <meta name="twitter:description" content="{{.SEO.Description}}">
  {{if .SEO.Image}}
  <meta property="og:image" content="{{.SEO.Image}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{.L.T "seo.imageAlt"}}">
  <meta name="twitter:image" content="{{.SEO.Image}}">
  <meta name="twitter:image:alt" content="{{.L.T "seo.imageAlt"}}">
  {{end}}
  {{if .SEO.JSONLD}}<script type="application/ld+json">{{.SEO.JSONLD}}</script>{{end}}
  {{end}}
{{end}}
