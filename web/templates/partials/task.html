{{define "task-item"}}<li class="task{{if .Done}} is-done{{end}}" id="tarefa-{{.ID}}" data-task="{{.ID}}">
  <button type="button" class="task-grip" aria-label="Arrastar para reordenar" title="Arrastar">
    <svg viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg>
  </button>
  <form class="task-toggle" method="post" action="/tarefas/{{.ID}}/concluir">
    <input type="hidden" name="done" value="{{if .Done}}0{{else}}1{{end}}">
    <button type="submit" class="task-check" role="checkbox" aria-checked="{{if .Done}}true{{else}}false{{end}}" aria-label="{{.Title}}">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-6.5"/></svg>
    </button>
  </form>
  <div class="task-main">
    <button type="button" class="task-title" data-edit="title" aria-label="Editar: {{.Title}}">{{.Title}}</button>
    <button type="button" class="task-time{{if not .Time}} is-empty{{end}}" data-edit="time" aria-label="{{if .Time}}Horário {{.Time}}, editar{{else}}Definir horário{{end}}">
      {{if .Time}}<time datetime="{{.Time}}">{{.Time}}</time>{{else}}<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>{{end}}
    </button>
  </div>
  <form class="task-remove" method="post" action="/tarefas/{{.ID}}/excluir">
    <button type="submit" class="task-delete" aria-label="Excluir: {{.Title}}">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </form>
</li>{{end}}
