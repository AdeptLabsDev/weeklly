{{define "content"}}
<main class="page">
  <div class="page-head">
    <h1 class="page-title">{{.L.T "hub.title"}}</h1>
    {{if .Data.Weeks}}{{template "order-toggle" .}}{{end}}
  </div>
  {{if .Data.Weeks}}
  <ul class="hub-list" data-week-list>
    {{range .Data.Weeks}}
    <li data-name="{{.Name}}" data-updated="{{.UpdatedAt}}"><a class="hub-item" href="{{.URL}}"><span class="hub-item-name">{{.Name}}</span><span class="hub-item-meta">{{.Updated}}</span></a></li>
    {{end}}
  </ul>
  {{else}}
  <div class="empty">
    <p class="page-lead">{{.L.T "hub.emptyLead"}}</p>
    <p class="empty-body">{{.L.T "hub.emptyBody"}}</p>
    <a class="btn btn-primary" href="/semanas/nova" data-open-dialog="new-week">{{.L.T "hub.createFirst"}}</a>
  </div>
  {{end}}
</main>
{{end}}
